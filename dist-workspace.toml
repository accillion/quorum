[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["LICENSE", "README.md"]
# Whether to enable GitHub Attestations
github-attestations = true
# Publish jobs to run in CI
publish-jobs = ["./publish-crates"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Tell cargo-dist's self-consistency check to leave release.yml alone.
# We hand-maintain a libdbus-1-dev install step that cargo-dist 0.31
# does not emit from [dist.dependencies.apt]. Removing this line will
# cause the next `dist host --steps=create` to fail with "out of date
# contents". See v0.3.1 failed release (workflow run 25924690415) for
# the original incident.
allow-dirty = ["ci"]

# WARNING: allow-dirty only protects the self-consistency *check*.
# Running `dist generate` will still overwrite release.yml and remove
# the manual libdbus step below. After any `dist generate`, re-add the
# manual step by hand.
[dist.dependencies.apt]
libdbus-1-dev = '*'
