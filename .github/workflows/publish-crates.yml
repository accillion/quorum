# Custom publish job referenced from release.yml via cargo-dist's
# publish-jobs = ["./publish-crates"]. Runs after host has cut the
# GitHub Release and publishes the workspace crates to crates.io in
# dependency order:
#
#   1. quorum-core           (no internal deps)
#   2. quorum-lippa-client   (no internal deps)
#   3. quorum-cli            (depends on both)
#
# Default `cargo publish` blocks until the new version is queryable
# on the registry index, so the next publish in the chain resolves
# the just-published path-dep version.
#
# Auth is crates.io Trusted Publishing: rust-lang/crates-io-auth-action
# exchanges this job's GitHub OIDC token for a short-lived crates.io
# token (revoked in the action's post step). No stored secret is used.
# crates.io matches the OIDC `workflow_ref` claim, which for a reusable
# workflow is the *caller* — so each crate's trusted-publisher config on
# crates.io names `release.yml`, not this file.

name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-22.04
    # release.yml (generated by cargo-dist) grants this call id-token and
    # packages. The job narrows that to the one permission it uses: the
    # OIDC token that Trusted Publishing exchanges. Nothing here touches
    # GitHub Packages, and any permission not listed is none.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Install libdbus (required for cargo package --verify of quorum-lippa-client)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish quorum-core
        run: cargo publish -p quorum-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish quorum-lippa-client
        run: cargo publish -p quorum-lippa-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish quorum-cli
        run: cargo publish -p quorum-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
