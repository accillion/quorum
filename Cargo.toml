[workspace]
resolver = "2"
members = [
    "crates/quorum-cli",
    "crates/quorum-core",
    "crates/quorum-lippa-client",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/accillion/quorum"
authors = ["Rolf Larsen"]
rust-version = "1.81"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
