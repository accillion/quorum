[[defect]]
id = "D1"
severity = "medium"
files = ["pydantic_ai_slim/pydantic_ai/models/test.py"]
title = "TestModel argument generation raises NotImplementedError for JSON Schema list-form type such as ['string', 'null']"
description = """
`_JsonSchemaTestData._gen_any` only matches `type` against single type names.
A tool schema may spell `type` as a JSON type list, for example
`{'type': ['string', 'null']}`, the nullable shape `zod-to-json-schema` emits,
and such schemas reach `TestModel` through MCP servers, AG-UI frontend tools
and `Tool.from_schema`. For those schemas `TestModel` raises
`NotImplementedError: Unknown type: ['string', 'null']` instead of generating
arguments and calling the tool. A non-empty type list should be handled by
letting the seed pick one member (as is already done for `anyOf`) while keeping
the sibling keywords (`minimum`, `minLength`, `items`, `properties`).
"""
