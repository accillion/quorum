[[defect]]
id = "D1"
severity = "medium"
files = ["crates/biome_html_analyze/src/lint/correctness/use_vue_valid_v_on.rs"]
title = "useVueValidVOn reports a missing handler for v-on with only verb modifiers like `@click.stop`"
description = """
Both the long-form `v-on:` and the `@` shorthand branches report
`MissingHandler` whenever the directive has no initializer. A directive that
carries one of the verb modifiers `.stop` or `.prevent` needs no handler: the
modifier itself calls `event.stopPropagation()` / `event.preventDefault()`
(eslint-plugin-vue's `valid-v-on` exempts these via `VERB_MODIFIERS`).
Observable failure (issue #10772): valid templates such as
`<div @click.stop></div>` and `<form @submit.prevent></form>` get a false
`useVueValidVOn` diagnostic.
"""

[[defect]]
id = "D2"
severity = "medium"
files = ["crates/biome_html_analyze/src/lint/correctness/use_vue_valid_v_on.rs"]
title = "Arg-less `v-on` with an object value is reported as missing an event name"
description = """
The long-form branch reports `MissingEventName` whenever `v-on` has no
argument, even when it has a value. An arg-less `v-on` with a value is Vue's
object syntax (`<div v-on="$listeners"></div>`, parallel to `v-bind="object"`)
and is valid; only a `v-on` with neither an event name nor a value is invalid.
Observable failure: `<div v-on="$listeners"></div>` gets a false diagnostic.
"""

[[defect]]
id = "D3"
severity = "low"
files = ["crates/biome_html_analyze/src/lint/correctness/use_vue_valid_v_on.rs"]
title = "find_invalid_modifiers uses token text with trailing trivia, so modifiers followed by whitespace look invalid"
description = """
`find_invalid_modifiers` reads the modifier name with `modifier_token.text()`,
which includes trailing trivia, instead of `text_trimmed()`. When a modifier is
followed by whitespace, as in `<Foo @click.stop />`, the name looked up is
`"stop "`, which is not in the valid-modifier set, so a valid modifier can be
reported as invalid (the same latent bug fixed on the v-bind side in #10767).
"""
