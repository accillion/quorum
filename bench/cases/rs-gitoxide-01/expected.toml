[[defect]]
id = "D1"
severity = "medium"
files = ["gix-merge/src/blob/builtin_driver/text/utils.rs"]
title = "Three-way text merge uses unpostprocessed Myers hunks, so split hunks cause false merge conflicts"
description = """
`collect_hunks` (gix-merge/src/blob/builtin_driver/text/utils.rs) takes the
hunks of `imara_diff::Diff::compute(algorithm, input)` as they come, without
calling `postprocess_lines` on the diff first. With the Myers algorithm,
imara-diff can split one logical change into a non-empty deletion plus an
empty insertion one unchanged base line later (for example on inputs with
ambiguous blank lines). That empty insertion then lands on the position of
the other side's deletion, and the overlap check treats it as intersecting,
so `gix_merge::blob::builtin_driver::text` reports `Resolution::Conflict`
(with conflict markers) for edits that `git merge-file` merges cleanly.
Issue #2475: GitButler's commit amend failed with `CherryPickMergeConflict`
because of this. The Histogram algorithm happened not to split the hunk.
The fix runs imara-diff's hunk post-processing
(`diff.postprocess_lines(input)`) before the hunks are collected, so the
split change comes back as one hunk.
"""
